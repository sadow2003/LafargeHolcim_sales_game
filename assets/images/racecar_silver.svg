<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160" width="100" height="160">
  <!-- Shadow -->
  <ellipse cx="50" cy="83" rx="38" ry="72" fill="rgba(0,0,0,0.25)"/>

  <!-- Main body (silver) -->
  <rect x="14" y="6" width="72" height="148" rx="28" ry="28" fill="#C0C0C0"/>

  <!-- Hood (navy, top) -->
  <path d="M14,34 Q14,6 50,6 Q86,6 86,34 Z" fill="#1A237E"/>

  <!-- Trunk (navy, bottom) -->
  <path d="M14,126 Q14,154 50,154 Q86,154 86,126 Z" fill="#1A237E"/>

  <!-- Cockpit (navy) -->
  <rect x="24" y="56" width="52" height="38" rx="10" fill="#1A237E"/>
  <!-- Windshield glare -->
  <rect x="30" y="60" width="40" height="28" rx="7" fill="rgba(255,255,255,0.12)"/>

  <!-- Racing stripes (white) -->
  <rect x="38" y="6" width="8" height="148" fill="white"/>
  <rect x="54" y="6" width="8" height="148" fill="white"/>

  <!-- Re-draw hood + trunk over stripes -->
  <path d="M14,34 Q14,6 50,6 Q86,6 86,34 Z" fill="#1A237E"/>
  <path d="M14,126 Q14,154 50,154 Q86,154 86,126 Z" fill="#1A237E"/>

  <!-- Wheels -->
  <rect x="-2" y="16" width="16" height="26" rx="4" fill="#212121"/>
  <rect x="86" y="16" width="16" height="26" rx="4" fill="#212121"/>
  <rect x="-2" y="118" width="16" height="26" rx="4" fill="#212121"/>
  <rect x="86" y="118" width="16" height="26" rx="4" fill="#212121"/>

  <!-- Headlights -->
  <ellipse cx="26" cy="14" rx="10" ry="6" fill="#FFE57F"/>
  <ellipse cx="74" cy="14" rx="10" ry="6" fill="#FFE57F"/>

  <!-- Centre circle -->
  <circle cx="50" cy="96" r="18" fill="white"/>
  <circle cx="50" cy="96" r="18" fill="none" stroke="#C0C0C0" stroke-width="4"/>
</svg>
