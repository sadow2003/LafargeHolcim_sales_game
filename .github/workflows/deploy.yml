name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env from secrets
        run: |
          echo "WEBSITE_LHM_PROJECT=${{ secrets.WEBSITE_LHM_PROJECT }}" > .env
          echo "ANDROID_LHM_PROJECT=${{ secrets.ANDROID_LHM_PROJECT }}" >> .env
          echo "IOS_LHM_Project=${{ secrets.IOS_LHM_Project }}" >> .env

      - name: Build Flutter web
        run: flutter build web --release --base-href /

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
